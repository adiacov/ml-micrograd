[project]
name = "ml-micrograd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = ["graphviz>=0.21", "ipykernel>=7.4.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
